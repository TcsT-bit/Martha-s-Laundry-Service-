<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MARTHA'S LAUNDRY OS v1.0.0</title>
<meta name="theme-color" content="#00D26A">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600;700&display=swap');
:root{ --orange:#FF5A00; --green:#00D26A; --cyan:#00D4FF; --red:#FF0040; }
body{font-family:'Rajdhani',sans-serif;background:#000;color:#fff;overflow-x:hidden}
#bg3d{position:fixed;inset:0;z-index:-1}
.quantum-text{font-family:'Orbitron',sans-serif;font-weight:900;text-shadow:0 0 15px var(--cyan)}
.glass{background:rgba(10,20,40,0.4);backdrop-filter:blur(25px);border:1px solid rgba(0,212,255,0.3);border-radius:24px}
.neon-border{box-shadow:0 0 20px rgba(0,212,255,0.4)}
.btn{background:linear-gradient(90deg,var(--green),var(--cyan));color:#000;padding:14px 24px;border-radius:14px;font-weight:900;border:none;cursor:pointer;transition:0.3s}
.btn:hover{transform:scale(1.05) translateY(-2px);box-shadow:0 0 30px var(--green)}
.btn-sec{background:rgba(0,212,255,0.1);border:1px solid var(--cyan);color:var(--cyan);padding:10px 18px;border-radius:12px;cursor:pointer}
.btn-danger{background:rgba(255,0,64,0.2);border:1px solid var(--red);color:var(--red)}
input,select,textarea{background:#0A0F1F;border:1px solid rgba(0,212,255,0.4);color:#fff;padding:14px;border-radius:12px;width:100%}
.hidden{display:none}.tab-btn{padding:12px 20px;border-radius:12px;cursor:pointer;font-weight:700}
.tab-btn.active{background:var(--cyan);color:#000;box-shadow:0 0 20px var(--cyan)}
.link-box{background:#000;border:3px solid var(--cyan);padding:14px;border-radius:12px;font-family:monospace;font-size:14px;user-select:all;color:var(--cyan);width:100%}
.admin-bar{background:rgba(0,0,0,0.7);backdrop-filter:blur(10px);border-bottom:2px solid var(--cyan);padding:12px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;position:sticky;top:0;z-index:100;}
.share-link{background:rgba(31,41,55,0.6);padding:12px;border-radius:10px;word-break:break-all;font-size:0.9rem;border:1px solid var(--cyan);color:var(--cyan);}
</style>
</head>
<body>
<canvas id="bg3d"></canvas>

<!-- LOGIN -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
  <div class="glass p-10 max-w-2xl w-full neon-border">
    <h1 class="text-6xl text-center quantum-text mb-2">MARTHA'S LAUNDRY</h1>
    <p class="text-center text-cyan-400 mb-8">OS v1.0.0 | FRESH & CLEAN</p>
    <div class="grid grid-cols-3 gap-4">
      <div onclick="selectRole('CEO')" class="glass p-6 text-center cursor-pointer"><div class="text-5xl">👑</div><b class="text-green-500">CEO</b></div>
      <div onclick="selectRole('Manager')" class="glass p-6 text-center cursor-pointer"><div class="text-5xl">📊</div><b class="text-cyan-500">MANAGER</b></div>
      <div onclick="selectRole('Reception')" class="glass p-6 text-center cursor-pointer"><div class="text-5xl">📞</div><b class="text-orange-500">RECEPTION</b></div>
    </div>
    <div id="passBox" class="hidden mt-6">
      <input id="email" type="email" placeholder="Enter Firebase Email">
      <input id="password" type="password" placeholder="Firebase Password" class="mt-2">
      <button onclick="login()" class="btn w-full mt-3">ENTER SYSTEM</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div class="admin-bar">
    <span class="quantum-text text-green-500" id="roleBadge">CEO</span>
    <button class="btn" style="width:auto" onclick="logout()">Logout</button>
    <button class="btn-sec" style="width:auto" onclick="generateClientLink()">GENERATE CLIENT LINK</button>
  </div>
  <div class="p-4 md:p-8">
    <div id="shareLinkBox" style="display:none;margin-bottom:15px" class="glass p-4">
      <h4 class="text-cyan-400 font-bold">Client Link Ready</h4>
      <div class="share-link mt-2" id="shareLink"></div>
      <button class="btn w-full mt-2" onclick="copyLink()">📋 COPY LINK</button>
    </div>

    <header class="glass p-5 flex justify-between items-center mb-6 neon-border">
      <h2 class="text-3xl quantum-text">MARTHA'S LAUNDRY OS</h2>
    </header>

    <div class="flex gap-3 mb-6 overflow-x-auto">
      <button onclick="showTab('dashboard')" class="tab-btn active">Dashboard</button>
      <button onclick="showTab('jobs')" class="tab-btn">Orders</button>
      <button onclick="showTab('quotes')" class="tab-btn" id="quoteTab">Quotes</button>
      <button onclick="showTab('stock')" class="tab-btn" id="stockTab">Detergent Stock</button>
      <button onclick="showTab('products')" class="tab-btn" id="prodTab">Services</button>
      <button onclick="showTab('clients')" class="tab-btn">Client Portal</button>
      <button onclick="showTab('payroll')" class="tab-btn" id="payTab">Payroll</button>
      <button onclick="showTab('reports')" class="tab-btn" id="repTab">Reports</button>
    </div>

    <div id="dashboard" class="tab">
      <div class="grid grid-cols-4 gap-4">
        <div class="glass p-5"><p class="text-5xl" id="statJobs">0</p><p>Active Orders</p></div>
        <div class="glass p-5" id="statRevBox"><p class="text-5xl text-green-400" id="statRev">R0</p><p>Revenue</p></div>
        <div class="glass p-5" id="statStockBox"><p class="text-5xl text-red-400" id="statStock">0</p><p>Low Stock</p></div>
        <div class="glass p-5" id="statQuoteBox"><p class="text-5xl" id="statQuotes">0</p><p>Open Quotes</p></div>
      </div>
      <div class="glass p-5 mt-4"><h3 class="font-bold text-xl mb-2">AUDIT LOG</h3><div id="auditLog"></div></div>
    </div>

    <div id="jobs" class="tab hidden">
      <button onclick="startScanner()" class="btn mb-3" id="scanBtn">📷 SCAN BAG TAG</button>
      <div id="reader" class="hidden w-full max-w-sm mb-3"></div>
      <div class="glass p-5 mb-4" id="jobForm">
        <div class="grid grid-cols-2 gap-3">
          <input id="jClient" placeholder="Client Name"><input id="jPhone" placeholder="27...">
          <input id="jReg" placeholder="Bag # / Order #"><input id="jBarcode" placeholder="Scan Item Tag">
          <select id="jStatus"><option>RECEIVED</option><option>WASHING</option><option>DRYING</option><option>IRONING</option><option>READY</option><option>COLLECTED</option></select>
          <input id="jAmount" type="number" placeholder="Amount R">
        </div>
        <button onclick="saveJob()" class="btn w-full mt-3">SAVE ORDER</button>
      </div>
      <div id="jobList"></div>
    </div>

    <div id="quotes" class="tab hidden"><div class="glass p-5 mb-4"><input id="qClient" placeholder="Client"><textarea id="qItems" placeholder="Service | Qty | Price"></textarea><button onclick="saveQuote()" class="btn w-full mt-2">GENERATE QUOTE PDF</button></div><div id="quoteList"></div></div>
    <div id="stock" class="tab hidden"><div class="glass p-5 mb-4"><input id="sName" placeholder="Detergent / Item"><input id="sQty" type="number" placeholder="Qty"><input id="sMin" type="number" placeholder="Min Alert"><input id="sCost" type="number" placeholder="Cost"><button onclick="addStock()" class="btn w-full mt-2">ADD STOCK</button></div><div id="stockList"></div></div>
    <div id="products" class="tab hidden"><div class="glass p-5 mb-4" id="prodForm"><input id="pName" placeholder="Service Name"><input id="pCode" placeholder="Service Code"><textarea id="pDesc" placeholder="Description: Wash, Dry, Iron"></textarea><input id="pImg" placeholder="Image URL"><input id="pVideo" placeholder="Video URL"><input id="pPrice" type="number" placeholder="Price R"><button onclick="saveProduct()" class="btn w-full mt-2">UPLOAD SERVICE</button></div><div id="productList" class="grid grid-cols-3 gap-4"></div></div>
    <div id="clients" class="tab hidden"><div id="clientLinks"></div></div>
    <div id="payroll" class="tab hidden"><div class="glass p-5"><input id="empName" placeholder="Employee Name"><input id="empSalary" type="number" placeholder="Salary R"><button onclick="addEmployee()" class="btn mt-2">ADD EMPLOYEE</button></div><div id="empList" class="mt-4"></div></div>
    <div id="reports" class="tab hidden"><button onclick="exportCSV()" class="btn">📊 EXPORT CSV</button><button onclick="exportPDF()" class="btn ml-2">📄 EXPORT PDF</button></div>
  </div>
</div>

<!-- CLIENT VIEW -->
<div id="clientView" class="hidden p-6"><div class="glass p-6 neon-border"><h2 class="text-4xl quantum-text mb-4">MARTHA'S LAUNDRY CLIENT PORTAL</h2><div id="clientJobs"></div><h3 class="text-2xl mt-6 mb-2">OUR SERVICES</h3><div id="clientProducts" class="grid grid-cols-3 gap-3"></div></div></div>

<script type="module">
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const { jsPDF } = window.jspdf;

const firebaseConfig = {
  apiKey: "AIzaSyDs4DKiI7VUR42UoFQc9Un6SH4V5_YyEhQ",
  authDomain: "martha-s-laundry-service.firebaseapp.com",
  databaseURL: "https://martha-s-laundry-service-default-rtdb.firebaseio.com",
  projectId: "martha-s-laundry-service",
  storageBucket: "martha-s-laundry-service.firebasestorage.app",
  messagingSenderId: "822690544543",
  appId: "1:822690544543:web:e42b85caff7a3598381baa",
  measurementId: "G-TV7LG577F0"
};

const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const db = getDatabase(app);
const auth = getAuth(app);

let DB = {jobs:[],products:[],clients:[],stock:[],quotes:[],employees:[],audit:[]};
let currentRole=''; let html5QrCode; let currentShareLink = '';
const LAUNDRY_WHATSAPP = '27799097420';

const categoriesRef = ref(db, 'marthaslaundryservice/categories');
const requestsRef = ref(db, 'marthaslaundryservice/requests');

// 3D BG
const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);const renderer=new THREE.WebGLRenderer({canvas:bg3d,alpha:true});renderer.setSize(innerWidth,innerHeight);
const torus=new THREE.Mesh(new THREE.TorusGeometry(10,3,16,100),new THREE.MeshBasicMaterial({color:0x00D26A,wireframe:true}));scene.add(torus);camera.position.z=30;function animate(){requestAnimationFrame(animate);torus.rotation.x+=0.01;torus.rotation.y+=0.01;renderer.render(scene,camera)}animate();

// LOGIN
function selectRole(r){currentRole=r;passBox.classList.remove('hidden')}
function login(){signInWithEmailAndPassword(auth, email.value, password.value).catch(e=>alert("Login Failed: "+e.message))}
function logout(){signOut(auth);localStorage.removeItem('mls_role');location.reload();document.getElementById('shareLinkBox').style.display='none';}

onAuthStateChanged(auth, user => {
  if(user){
    if(user.email.includes('ceo')) currentRole='CEO';
    else if(user.email.includes('manager')) currentRole='Manager';
    else currentRole='Reception';
    localStorage.setItem('mls_role',currentRole);initApp()
  }
})

function initApp(){
  loginScreen.classList.add('hidden');app.classList.remove('hidden');roleBadge.innerText=currentRole;
  if(currentRole==="Reception"){
    repTab.classList.add('hidden');payTab.classList.add('hidden');stockTab.classList.add('hidden');
    prodTab.classList.add('hidden');quoteTab.classList.add('hidden');
    statRevBox.classList.add('hidden');statStockBox.classList.add('hidden');statQuoteBox.classList.add('hidden');
    prodForm.classList.add('hidden');scanBtn.classList.add('hidden');
  }
  if(currentRole==="Manager"){payTab.classList.add('hidden');repTab.classList.add('hidden')}
  loadFirebaseData();renderAll();
}

function showTab(id){document.querySelectorAll('.tab').forEach(t=>t.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');
document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));event.target.classList.add('active')}

function generateClientLink(){
  const baseUrl = window.location.origin + window.location.pathname;
  currentShareLink = baseUrl + '#client';
  document.getElementById('shareLink').innerText = currentShareLink;
  document.getElementById('shareLinkBox').style.display = 'block';
  alert('Client Link Generated! Click COPY LINK to share.');
}
function copyLink(){navigator.clipboard.writeText(currentShareLink); alert('Link Copied!');}

// FIREBASE LOAD - ALL DATA NOW UNDER 2 NODES TO MATCH RULES
function loadFirebaseData(){
  onValue(categoriesRef, snap => {
    const data = snap.val() || {};
    DB.products = Object.values(data).filter(x=>x.type==='service');
    DB.stock = Object.values(data).filter(x=>x.type==='stock');
    renderProducts(); renderStock();
  });
  onValue(requestsRef, snap => {
    const data = snap.val() || {};
    DB.jobs = Object.values(data).filter(x=>x.type==='job');
    DB.quotes = Object.values(data).filter(x=>x.type==='quote');
    DB.clients = Object.values(data).filter(x=>x.type==='client');
    renderJobs(); renderQuotes(); renderClients();
  });
}

// BARCODE
function startScanner(){reader.classList.remove('hidden');html5QrCode=new Html5Qrcode("reader");html5QrCode.start({facingMode:"environment"},{fps:10},(code)=>{jBarcode.value=code;html5QrCode.stop();reader.classList.add('hidden')})}

// ORDERS -> save to requests
function saveJob(){
  const job={id:Date.now(),type:'job',client:jClient.value,phone:jPhone.value,reg:jReg.value,barcode:jBarcode.value,status:jStatus.value,amount:+jAmount.value||0,code:Math.random().toString(36).substr(2,8).toUpperCase()};
  set(ref(db, 'marthaslaundryservice/requests/'+job.id), job);
  const client={id:jPhone.value,type:'client',name:jClient.value,phone:jPhone.value};
  if(!DB.clients.find(c=>c.phone===jPhone.value))set(ref(db, 'marthaslaundryservice/requests/client_'+jPhone.value), client);
  addAudit(`Order Created: ${jReg.value}`);jClient.value='';jPhone.value='';jReg.value='';jAmount.value='';
}
function renderJobs(){
  jobList.innerHTML='';DB.jobs.slice(-20).reverse().forEach(j=>{
  jobList.innerHTML+=`<div class="glass p-4 mb-3">
    <div class="flex justify-between"><b>${j.reg}</b> <span class="text-green-400">R${j.amount}</span></div>
    <p>${j.client} | Status: ${j.status} | Code: ${j.code}</p>
    <div class="flex gap-2 mt-2 flex-wrap">
      <button onclick="genPDF(${j.id})" class="btn-sec text-xs">PDF INVOICE</button>
      <button onclick="sendWA('${j.phone}','${j.reg}','${j.status}')" class="btn-sec text-xs">WHATSAPP</button>
      <button onclick="delJob(${j.id})" class="btn-sec btn-danger text-xs">DELETE</button>
    </div>
  </div>`});statJobs.innerText=DB.jobs.filter(j=>j.status!=='COLLECTED').length;statRev.innerText='R'+DB.jobs.reduce((a,b)=>a+b.amount,0).toLocaleString()
}
function genPDF(id){const j=DB.jobs.find(x=>x.id===id);const doc=new jsPDF();doc.text("MARTHA'S LAUNDRY INVOICE",20,20);doc.text(`Client:${j.client}`,20,30);doc.text(`Order:${j.reg}`,20,40);doc.text(`Item:${j.barcode}`,20,50);doc.text(`TOTAL:R${j.amount}`,20,70);doc.save(`INVOICE_${j.reg}.pdf`)}
function sendWA(phone,reg,status){window.open(`https://wa.me/${phone}?text=*MARTHA'S LAUNDRY UPDATE*%0A${reg}: ${status}%0ATrack: ${window.location.origin + window.location.pathname}#client`,'_blank')}

// QUOTES -> save to requests
function saveQuote(){const quote={id:Date.now(),type:'quote',client:qClient.value,items:qItems.value};set(ref(db, 'marthaslaundryservice/requests/'+quote.id), quote);const doc=new jsPDF();doc.text(`QUOTATION FOR: ${qClient.value}`,20,20);doc.text(qItems.value,20,30);doc.save(`QUOTE_${qClient.value}.pdf`);addAudit(`Quote for ${qClient.value}`);qClient.value='';qItems.value='';}
function renderQuotes(){quoteList.innerHTML='';DB.quotes.forEach(q=>quoteList.innerHTML+=`<div class="glass p-3 mb-2">${q.client}</div>`);statQuotes.innerText=DB.quotes.length}

// STOCK -> save to categories. Only CEO/Manager can write
function addStock(){const item={id:Date.now(),type:'stock',name:sName.value,qty:+sQty.value,min:+sMin.value,cost:+sCost.value};set(ref(db, 'marthaslaundryservice/categories/'+item.id), item);addAudit(`Stock Added: ${sName.value}`);sName.value='';sQty.value='';}
function renderStock(){stockList.innerHTML='';let low=0;DB.stock.forEach(s=>{if(s.qty<s.min)low++;stockList.innerHTML+=`<div class="glass p-3 mb-2">${s.name} - Qty:${s.qty} Cost:R${s.cost} ${s.qty<s.min?'<span class="text-red-400">LOW STOCK</span>':''}</div>`});statStock.innerText=low}

// SERVICES -> save to categories. Only CEO/Manager can write
function saveProduct(){
  const prod={id:Date.now(),type:'service',name:pName.value,code:pCode.value,desc:pDesc.value,img:pImg.value,video:pVideo.value,price:+pPrice.value};
  set(ref(db, 'marthaslaundryservice/categories/'+prod.id), prod);addAudit(`Service: ${pName.value}`);pName.value='';pCode.value='';
}
function renderProducts(){
  productList.innerHTML='';DB.products.forEach(p=>{productList.innerHTML+=`<div class="glass p-3"><img src="${p.img}" class="w-full h-40 object-cover rounded mb-2"><b>${p.name}</b><br><span class="text-cyan-400">${p.code}</span><br>R${p.price}<button onclick="requestService('${p.code}','${p.name}',${p.price})" class="btn-sec w-full mt-1">REQUEST SERVICE</button>${currentRole!=='Reception'?`<button onclick="delProd(${p.id})" class="btn-sec btn-danger w-full mt-1">DELETE</button>`:''}</div>`})
}
function delProd(id){remove(ref(db, 'marthaslaundryservice/categories/'+id))}

// CLIENTS
function renderClients(){clientLinks.innerHTML='';DB.clients.forEach(c=>{
  const link=`${window.location.origin + window.location.pathname}#client`;
  clientLinks.innerHTML+=`<div class="glass p-4 mb-3">
    <b>${c.name}</b> - ${c.phone}
    <input value="${link}" readonly onclick="this.select()" class="link-box mt-1">
    <button onclick="copyLink()" class="btn-sec mt-1">COPY LINK</button>
  </div>`
})}

// PAYROLL - local only
function addEmployee(){DB.employees.push({id:Date.now(),name:empName.value,salary:+empSalary.value});renderEmp();addAudit(`Employee Added: ${empName.value}`);empName.value='';empSalary.value='';}
function renderEmp(){empList.innerHTML='';DB.employees.forEach(e=>empList.innerHTML+=`<div class="glass p-3 mb-2">${e.name} - R${e.salary.toLocaleString()}</div>`)}

// REPORTS
function exportCSV(){let csv="Order,Client,Amount,Status\n";DB.jobs.forEach(j=>csv+=`${j.reg},${j.client},${j.amount},${j.status}\n`);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv]));a.download="MARTHAS_REPORT.csv";a.click()}
function exportPDF(){const doc=new jsPDF();doc.text("MARTHA'S LAUNDRY REPORT",20,20);doc.text(`Total Orders:${DB.jobs.length}`,20,30);doc.text(`Revenue:R${DB.jobs.reduce((a,b)=>a+b.amount,0)}`,20,40);doc.save("MARTHAS_REPORT.pdf")}

// AUDIT
function renderAudit(){auditLog.innerHTML=DB.audit.slice(0,10).map(a=>`<p class="text-xs">${a.time} - ${a.user}: ${a.action}</p>`).join('')}
function addAudit(action){DB.audit.unshift({time:new Date().toLocaleString(),user:currentRole,action});if(DB.audit.length>50)DB.audit.pop()}

// CLIENT REQUEST
function requestService(code, name, price){
  const message = `*NEW SERVICE REQUEST - MARTHA'S LAUNDRY*%0A%0A*Service:* ${name}%0A*Code:* ${code}%0A*Price:* R${price}%0A%0A*Message:* Hello Martha's Laundry, I would like to book this service.%0A%0A*Client Details:*%0AName: _______________%0AContact: _______________%0A%0A*MARTHA'S LAUNDRY OS*`;
  window.open(`https://wa.me/${LAUNDRY_WHATSAPP}?text=${message}`,'_blank');
  alert(`Request sent to Martha's Laundry. We will contact you shortly.`);
}

// CLIENT VIEW
function checkClientView(){
  const hash = window.location.hash;
  if(hash === '#client'){
    loginScreen.classList.add('hidden');app.classList.add('hidden');clientView.classList.remove('hidden');
    clientJobs.innerHTML=DB.jobs.map(j=>`<div class="glass p-3 mb-2">${j.reg} - ${j.status}</div>`).join('');
    clientProducts.innerHTML=DB.products.map(p=>`<div class="glass p-3"><img src="${p.img}" class="w-full h-40 object-cover rounded mb-2"><b>${p.name}</b><br><span class="text-cyan-400">${p.code}</span><br>R${p.price}<button onclick="requestService('${p.code}','${p.name}',${p.price})" class="btn-sec w-full mt-1">📩 BOOK NOW</button></div>`).join('');
  }
}

// INIT
function renderAll(){renderJobs();renderProducts();renderStock();renderQuotes();renderClients();renderEmp();renderAudit()}
window.onload=()=>{const r=localStorage.getItem('mls_role');if(r){currentRole=r}checkClientView()}
function delJob(id){remove(ref(db, 'marthaslaundryservice/requests/'+id));addAudit(`Order Deleted: ${id}`)}
</script>
</body>
</html>
