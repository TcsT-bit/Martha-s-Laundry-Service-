<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MARTHA'S LAUNDRY & PROJECTS | WASHING & IRONING SERVICE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
:root{--bg:#0a0f0d;--card:rgba(255,255,255,0.08);--accent:#00ff88;--accent2:#00d4ff;--green:#00ff88;--blue:#00d4ff;--purple:#a855f7;--text:#fff;--muted:#94a3b8;--border:rgba(255,255,255,0.15);--danger:#ff4d6d}
*{box-sizing:border-box;font-family:'Poppins',sans-serif}
body{margin:0;background:#000;color:var(--text)}
.header{background:linear-gradient(90deg,rgba(72,105,100,0.8),rgba(101,138,73,0.8));padding:12px;position:sticky;top:0;z-index:99}
.logo{width:50px;height:50px;border-radius:12px;background:#fff;padding:3px}
.search-box{flex:1;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:25px;padding:8px 15px}
.search-box input{border:none;outline:none;width:100%;background:transparent;color:#fff}
.nav-cats{display:flex;gap:15px;overflow-x:auto;margin-top:10px}
.nav-cats button{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;padding:8px 16px;border-radius:20px;font-weight:600;cursor:pointer}
.nav-cats button.active{background:linear-gradient(90deg,var(--accent),var(--accent2))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;padding:10px}
.card{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:16px;padding:10px}
.card img{width:100%;height:160px;object-fit:cover;border-radius:8px}
.price{color:var(--accent);font-weight:800;margin-top:auto}
.btn-cart{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#000;border:none;width:100%;padding:8px;border-radius:8px;font-weight:700;cursor:pointer;margin-top:8px}
.admin,.login-box{background:rgba(255,255,255,0.08);padding:15px;border-radius:12px;margin:15px;border:1px solid rgba(255,255,255,0.15)}
.login-box{max-width:400px;margin:40px auto}
.role-badge{padding:4px 10px;border-radius:15px;font-size:10px;font-weight:800;color:#000}
.role-ceo{background:var(--purple)}.role-manager{background:var(--blue)}.role-reception{background:var(--green)}
.tabs{display:flex;gap:8px;border-bottom:2px solid rgba(255,255,255,0.1);margin-bottom:15px}
.tab{padding:10px 15px;cursor:pointer;font-weight:600}
.tab.active{border-bottom:3px solid var(--accent);color:var(--accent)}
input,select,textarea{width:100%;padding:10px;margin:6px 0;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:#fff}
.btn{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#000;border:none;padding:10px 15px;border-radius:8px;font-weight:700;cursor:pointer}
.btn-blue{background:linear-gradient(90deg,var(--blue),#0099cc)}.btn-green{background:linear-gradient(90deg,var(--green),#00cc66)}.btn-purple{background:linear-gradient(90deg,var(--purple),#9333ea)}.btn-danger{background:linear-gradient(90deg,var(--danger),#ff1a4b)}
.cart-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,0.9);padding:12px;display:none;z-index:100}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:15px}
.stat-card{background:linear-gradient(135deg,rgba(72,105,100,0.8),rgba(101,138,73,0.8));color:#fff;padding:15px;border-radius:10px;text-align:center}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);display:none;justify-content:center;align-items:center;z-index:999}
.modal-content{background:#141e1c;padding:20px;border-radius:15px;width:90%;max-width:400px}
.error{color:var(--danger);text-align:center;padding:10px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<div id="quickInvoiceModal" class="modal"><div class="modal-content"><h3>🧾 Quick Invoice</h3><input id="quickInvName" placeholder="Customer Name"><input id="quickInvItem" placeholder="Service"><input type="number" id="quickInvQty" value="1"><input type="number" id="quickInvPrice" placeholder="Price R"><button class="btn" onclick="downloadQuickInvoice()">Download PDF</button><button class="btn" style="background:#555" onclick="quickInvoiceModal.style.display='none'">Cancel</button></div></div>

<div id="customerModal" class="modal"><div class="modal-content"><h3>Customer Details</h3><input id="custName" placeholder="Name"><input id="custPhone" placeholder="Phone"><div style="background:rgba(0,255,136,0.1);padding:10px;border-radius:8px;margin:10px 0">🏦 Capitec: 2218290827</div><button class="btn" onclick="sendQuote()">Book via WhatsApp</button><button class="btn" style="background:#555" onclick="customerModal.style.display='none'">Cancel</button></div></div>

<div id="clientView" style="display:none">
  <div class="header"><img src="https://i.ibb.co/3Y7LzWPw/IMG-20260731-WA3745.jpg" class="logo"><h2>MARTHA'S LAUNDRY</h2><div class="search-box"><input id="clientSearchInput" placeholder="Search..." onkeyup="searchProducts()"></div></div>
  <div class="grid" id="clientProductGrid"><div class="error">Loading services...</div></div>
  <div class="cart-bar" id="clientCartBar"><b>Cart: <span id="clientCartCount">0</span> | R<span id="clientCartTotal">0</span></b> <button class="btn" onclick="openCustomerModal()">Book</button></div>
</div>

<div id="loginScreen"><div class="login-box"><h2>ML BIZPORTAL</h2><div id="loginError" class="error"></div><input id="loginEmail" placeholder="Email"><input type="password" id="loginPass" placeholder="Password"><button class="btn" onclick="doLogin()" style="width:100%">Login</button></div></div>

<div id="app" style="display:none">
  <div class="header"><div style="display:flex;justify-content:space-between;align-items:center"><img src="https://i.ibb.co/3Y7LzWPw/IMG-20260731-WA3745.jpg" class="logo"><div class="search-box"><input id="searchInput" placeholder="Search..." onkeyup="searchProducts()"></div><span class="role-badge" id="userRole">ADMIN</span><button class="btn" onclick="logout()">Logout</button></div>
  <div class="nav-cats"><button onclick="filterCat('All',event)" class="active">All</button><button onclick="filterCat('Washing',event)">Washing</button><button onclick="filterCat('Blankets',event)">Blankets</button><button onclick="filterCat('Shoes',event)">Shoes</button></div></div>
  <div class="admin"><div class="tabs"><div class="tab active" onclick="showTab('dashboard',this)">Dashboard</div><div class="tab" onclick="showTab('products',this)">Services</div><div class="tab" onclick="showTab('stock',this)">Stock</div><div class="tab" onclick="showTab('orders',this)">Bookings</div></div>
  <div id="tab-dashboard"><div class="stats"><div class="stat-card"><h4 id="statProducts">0</h4><small>Services</small></div><div class="stat-card"><h4 id="statStock">0</h4><small>Stock</small></div><div class="stat-card"><h4 id="statOrders">0</h4><small>Pending</small></div></div><button class="btn-blue" onclick="quickInvoiceModal.style.display='flex'">🧾 Quick Invoice</button></div>
  <div id="tab-products" style="display:none"><h3 id="formTitle">➕ Add Service</h3><button class="btn-purple" onclick="seedDatabase()">⚡ Load Services</button><input id="pName" placeholder="Name"><select id="pCat"><option>Washing</option><option>Blankets</option><option>Shoes</option></select><input id="pPrice" type="number" placeholder="Price"><input id="pStock" type="number" placeholder="Stock"><button class="btn" id="saveBtn" onclick="saveProduct()">Save</button><button class="btn" style="background:#555" id="cancelBtn" onclick="cancelEdit()" style="display:none">Cancel</button><input id="adminSearch" placeholder="🔍 Search"><div id="productList"></div></div>
  <div id="tab-stock" style="display:none"><div id="stockList"></div></div>
  <div id="tab-orders" style="display:none"><div id="ordersList">Loading...</div></div></div>
  <h2 style="padding:10px">⭐ Featured Services</h2><div class="grid" id="productGrid"><div class="error">Loading services...</div></div>
  <div class="cart-bar" id="cartBar"><b>Cart: <span id="cartCount">0</span> | R<span id="cartTotal">0</span></b> <button class="btn" onclick="openCustomerModal()">Book</button></div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getDatabase, ref, set, onValue, remove, get } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
const { jsPDF } = window.jspdf;

const firebaseConfig = {apiKey:"AIzaSyDs4DKiI7VUR42UoFQc9Un6SH4V5_YyEhQ",authDomain:"martha-s-laundry-service.firebaseapp.com",databaseURL:"https://martha-s-laundry-service-default-rtdb.firebaseio.com",projectId:"martha-s-laundry-service"};
const BUSINESS_WHATSAPP="27607557560";
const app=initializeApp(firebaseConfig); const db=getDatabase(app); const auth=getAuth(app);
const productsRef=ref(db,'marthaslaundryservice/categories'); const ordersRef=ref(db,'marthaslaundryservice/requests');
let products={},orders={},cart=[],currentUser={role:'reception'},currentFilter='All',editingId=null;

const isClientMode=new URLSearchParams(location.search).has('client');
if(isClientMode){loginScreen.style.display='none';app.style.display='none';clientView.style.display='block';}

onAuthStateChanged(auth,async user=>{
  if(isClientMode)return;
  if(user){
    currentUser.role=user.email.includes('ceo')?'ceo':user.email.includes('manager')?'manager':'reception';
    loginScreen.style.display='none';app.style.display='block';
    userRole.innerText=currentUser.role.toUpperCase();userRole.className='role-badge role-'+currentUser.role;
    const snap=await get(productsRef); if(!snap.exists())seedDatabase();
    loadAll();
  }else{loginScreen.style.display='block';app.style.display='none';}
});

function loadAll(){
  onValue(productsRef,s=>{products=s.val()||{};renderProducts();renderClientProducts();buildProductList();buildStockList();updateDashboard();},e=>console.error(e));
  onValue(ordersRef,s=>{orders=s.val()||{};buildOrders();updateDashboard();});
}

window.doLogin=async()=>{loginError.innerText='Logging in...';try{await signInWithEmailAndPassword(auth,loginEmail.value,loginPass.value);}catch(e){loginError.innerText=e.message;}}
window.logout=()=>signOut(auth);
window.showTab=(t,el)=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');['dashboard','products','stock','orders'].forEach(x=>document.getElementById('tab-'+x).style.display=t==x?'block':'none');}

function updateDashboard(){statProducts.innerText=Object.keys(products).length;statStock.innerText=Object.values(products).reduce((a,b)=>a+(b.stock||0),0);statOrders.innerText=Object.values(orders).filter(o=>o.status=='Pending').length;}

window.switchImage=(id,url,thumb)=>{document.getElementById('main_'+id).src=url;document.querySelectorAll(`#card_${id}.card-imgs img`).forEach(i=>i.classList.remove('active'));thumb.classList.add('active');} // FIXED SPACE

function cardHTML(id,p){let btn=p.stock>0?(cart.find(x=>x.id==id)?`<div style="display:flex;gap:5px;margin-top:8px"><button class="btn" onclick="decreaseQty('${id}')">-</button><span>${cart.find(x=>x.id==id).qty}</span><button class="btn" onclick="addToCart('${id}')">+</button></div>`:`<button class="btn-cart" onclick="addToCart('${id}')">Book Now</button>`):`<button class="btn" disabled>Unavailable</button>`;return `<div class="card" id="card_${id}"><img id="main_${id}" src="https://i.ibb.co/3Y7LzWPw/IMG-20260731-WA3745.jpg"><h4>${p.name}</h4><div class="price">R${p.price}</div>${btn}</div>`;}

function renderProducts(){if(isClientMode)return;productGrid.innerHTML=Object.entries(products).filter(([id,p])=>(currentFilter=='All'||p.category==currentFilter)&&p.name.toLowerCase().includes(searchInput.value.toLowerCase())).map(([id,p])=>cardHTML(id,p)).join('')||'<div class="error">No services. Click "Load Services"</div>';}
function renderClientProducts(){if(!isClientMode)return;clientProductGrid.innerHTML=Object.entries(products).filter(([id,p])=>(currentFilter=='All'||p.category==currentFilter)&&p.name.toLowerCase().includes(clientSearchInput.value.toLowerCase())).map(([id,p])=>cardHTML(id,p)).join('')||'<div class="error">No services</div>';}

window.searchProducts=()=>{renderProducts();renderClientProducts();}
window.filterCat=(c,e)=>{currentFilter=c;renderProducts();renderClientProducts();document.querySelectorAll('.nav-cats button').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');}

function buildProductList(){if(currentUser.role=='reception')return;productList.innerHTML=Object.entries(products).map(([id,p])=>`<div style="padding:10px;border:1px solid var(--border);margin:5px 0;border-radius:8px"><b>${p.name}</b> - R${p.price} - Stock:${p.stock}<div style="float:right"><button class="btn-blue" onclick="editProduct('${id}')">Edit</button>${currentUser.role=='ceo'?`<button class="btn-danger" onclick="deleteProduct('${id}')">Del</button>`:''}</div></div>`).join('');}
function buildStockList(){stockList.innerHTML=Object.entries(products).map(([id,p])=>`<div style="display:flex;justify-content:space-between;padding:8px;border:1px solid var(--border);margin:5px 0"><div><b>${p.name}</b><br><small>Stock:${p.stock}</small></div><div><input type="number" id="stock_${id}" value="0" style="width:70px"><button class="btn-green" onclick="updateStock('${id}')">+Add</button></div></div>`).join('');}
function buildOrders(){ordersList.innerHTML=Object.entries(orders).reverse().map(([id,o])=>`<div style="padding:10px;border-left:4px solid var(--accent);margin:10px 0;background:rgba(255,255,255,0.08)"><b>#${id.slice(-6)}</b> - R${o.total} - ${o.status}<br><small>${o.customerName||'Guest'}</small><br><button class="btn-green" onclick="updateOrderStatus('${id}','Completed')">Complete</button></div>`).join('')||'No bookings';}

window.addToCart=id=>{let p=products[id],item=cart.find(x=>x.id==id);item?item.qty++:cart.push({id,...p,qty:1});updateCart();renderProducts();renderClientProducts();}
window.decreaseQty=id=>{let item=cart.find(x=>x.id==id);if(item){item.qty--;if(item.qty<=0)cart=cart.filter(x=>x.id!=id);}updateCart();renderProducts();renderClientProducts();}
function updateCart(){let c=cart.reduce((a,b)=>a+b.qty,0),t=cart.reduce((a,b)=>a+b.qty*b.price,0);cartBar.style.display=clientCartBar.style.display=c?'block':'none';cartCount.innerText=clientCartCount.innerText=c;cartTotal.innerText=clientCartTotal.innerText=t;}

window.openCustomerModal=()=>{if(!cart.length)return alert('Cart empty');customerModal.style.display='flex';}
window.sendQuote=()=>{let n=custName.value,p=custPhone.value;if(!n||!p)return alert('Fill name+phone');set(ref(db,'marthaslaundryservice/requests/'+Date.now()),{customerName:n,customerPhone:p,items:cart,total:cart.reduce((a,b)=>a+b.qty*b.price,0),date:new Date().toISOString(),status:'Pending'});window.open(`https://wa.me/${BUSINESS_WHATSAPP}?text=${encodeURIComponent(`🧺 Booking\n${n}\n${p}\nTotal:R${cart.reduce((a,b)=>a+b.qty*b.price,0)}`)}`);cart=[];updateCart();customerModal.style.display='none';}

window.editProduct=id=>{let p=products[id];editingId=id;pName.value=p.name;pCat.value=p.category;pPrice.value=p.price;pStock.value=p.stock;formTitle.innerText='✏️ Editing '+p.name;saveBtn.innerText='Update';cancelBtn.style.display='inline-block';}
window.cancelEdit=()=>{editingId=null;[pName,pPrice,pStock].forEach(i=>i.value='');formTitle.innerText='➕ Add Service';saveBtn.innerText='Save';cancelBtn.style.display='none';}
window.saveProduct=()=>{let data={name:pName.value,category:pCat.value,price:+pPrice.value||0,stock:+pStock.value||0};if(!data.name)return alert('Name required');set(ref(db,'marthaslaundryservice/categories/'+(editingId||Date.now())),data).then(()=>{alert('Saved!');cancelEdit();});}
window.deleteProduct=id=>{if(confirm('Delete?'))remove(ref(db,'marthaslaundryservice/categories/'+id));}
window.updateStock=id=>{let add=+document.getElementById('stock_'+id).value;set(ref(db,'marthaslaundryservice/categories/'+id+'/stock'),(products[id].stock||0)+add);}

window.seedDatabase=()=>{[{n:"Big Basket",c:"Washing",p:500},{n:"Medium Basket",c:"Washing",p:350},{n:"Small Basket",c:"Washing",p:200},{n:"Big Blanket",c:"Blankets",p:200},{n:"Medium Blanket",c:"Blankets",p:130},{n:"Throw",c:"Blankets",p:50},{n:"Shoes White",c:"Shoes",p:50},{n:"Shoes Black",c:"Shoes",p:40}].forEach(s=>set(ref(db,'marthaslaundryservice/categories/'+Date.now()+Math.random()),{name:s.n,category:s.c,price:s.p,stock:100}));alert('Services loaded!');}

window.updateOrderStatus=(id,s)=>set(ref(db,'marthaslaundryservice/requests/'+id+'/status'),s);
window.downloadQuickInvoice=()=>{let n=quickInvName.value,it=quickInvItem.value,qt=+quickInvQty.value,pr=+quickInvPrice.value;set(ref(db,'marthaslaundryservice/requests/'+Date.now()),{customerName:n,items:[{name:it,qty:qt,price:pr}],total:qt*pr,date:new Date().toISOString(),status:'Completed'});const doc=new jsPDF();doc.text(`${n} - ${it} x${qt} = R${qt*pr}`,10,10);doc.save('quick.pdf');quickInvoiceModal.style.display='none';}
</script></body></html>
